name: Security Audit

on:
  push:
    branches: [ "main", "framework-stable" ]
  pull_request:
    branches: [ "main", "framework-stable" ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Run npm audit
        continue-on-error: true
        run: npm audit --audit-level=high || true
